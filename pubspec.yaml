
name: reem_front
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # API Laravel
  http: ^1.2.0
  http_parser: ^4.0.0

  # State management
  provider: ^6.1.1

  # Auth
  google_sign_in: ^6.1.0

  # Sélection de fichiers
  file_picker: ^10.3.3

  # Vidéo / lecture
  video_player: ^2.11.1
  video_trimmer: ^5.0.0
  ffmpeg_kit_flutter_new_min: ^3.6.8
  path_provider: ^2.1.5

  # Camera
  camera: ^0.12.0+1
  camera_windows: ^0.2.6+5

  # Media player
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # UI
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.1
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/reem_logo.png
    - assets/images/reem_icon.png
    - assets/images/reem_logo_square.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/reem_icon.png"
  adaptive_icon_background: "#21164F"
  adaptive_icon_foreground: "assets/images/reem_icon.png"
  web:
    generate: true
    image_path: "assets/images/reem_icon.png"
    background_color: "#21164F"
    theme_color: "#6D35E8"